<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Asegurar que la sección ocupe toda la altura de la ventana */
        .full-height {
            height: 100vh;
        }

        /* Centrar el contenido vertical y horizontalmente */
        .center-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ajustar el margen de cascading-right para mejor alineación */
        .cascading-right {
            margin-right: -50px;
        }

        @media (max-width: 991.98px) {
            .cascading-right {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Sección: Bloque de diseño -->
    <section class="text-center text-lg-start full-height center-content">
        <!-- Jumbotron -->
        <div class="container py-4">
            <div class="row g-0 align-items-center">
                <div class="col-lg-6 mb-5 mb-lg-0">
                    <div class="card cascading-right bg-body-tertiary" style="backdrop-filter: blur(30px);">
                        <div class="card-body p-5 shadow-5 text-center">
                            <h2 class="fw-bold mb-5">Regístrate</h2>
                            <form action="register.php" method="POST">
                                <!-- Diseño de cuadrícula de 2 columnas con entradas de texto para nombres -->
                                <div class="row">
                                  <div class="col-md-6 mb-4">
                                    <div class="form-outline">
                                      <input type="text" name="nombre" id="form3Example1" class="form-control" required />
                                      <label class="form-label" for="form3Example1">Nombre</label>
                                    </div>
                                  </div>
                                  <div class="col-md-6 mb-4">
                                    <div class="form-outline">
                                      <input type="text" name="apellido" id="form3Example2" class="form-control" required />
                                      <label class="form-label" for="form3Example2">Apellido</label>
                                    </div>
                                  </div>
                                </div>
                              
                                <!-- Entrada de correo electrónico -->
                                <div class="form-outline mb-4">
                                  <input type="email" name="correo" id="form3Example3" class="form-control" required />
                                  <label class="form-label" for="form3Example3">Correo electrónico</label>
                                </div>
                              
                                <!-- Entrada de contraseña -->
                                <div class="form-outline mb-4">
                                  <input type="password" name="clave" id="form3Example4" class="form-control" required />
                                  <label class="form-label" for="form3Example4">Contraseña</label>
                                </div>
                              
                                <!-- Checkbox (opcional, no tiene impacto en PHP si no le asignas name) -->
                                <div class="form-check d-flex justify-content-center mb-4">
                                  <input class="form-check-input me-2" type="checkbox" value="" id="form2Example33" checked />
                                  <label class="form-check-label" for="form2Example33">
                                    Suscribirse a nuestro newsletter
                                  </label>
                                </div>
                              
                                <!-- Botón de envío -->
                                <button type="submit" class="btn btn-primary btn-block mb-4">
                                  Registrarse
                                </button>
                              
                                <!-- Botones de registro social (decorativo) -->
                                <div class="text-center">
                                  <p>o regístrate con:</p>
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                    <i class="fab fa-facebook-f"></i>
                                  </button>
                              
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                    <i class="fab fa-google"></i>
                                  </button>
                              
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                    <i class="fab fa-twitter"></i>
                                  </button>
                              
                                  <button type="button" class="btn btn-link btn-floating mx-1">
                                    <i class="fab fa-github"></i>
                                  </button>
                                </div>
                              </form>
                              
                        </div>
                    </div>
                </div>

                <div class="col-lg-6 mb-5 mb-lg-0">
                    <img src="https://mdbootstrap.com/img/new/ecommerce/vertical/004.jpg" class="w-100 rounded-4 shadow-4" alt="Imagen de registro" />
                </div>
            </div>
        </div>
        <!-- Jumbotron -->
    </section>
    <!-- Sección: Bloque de diseño -->

    <!-- Bootstrap Bundle con Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
